scan_to_scan_filter_chain:
  ros__parameters:
    filter1:
      name: remove_blind_sector
      type: laser_filters/LaserScanAngularBoundsFilterInPlace
      params:
        lower_angle: -1.0472
        upper_angle: 0.6850
        replace_with_nan: true

    filter2:
      name: remove_lidar_mount
      type: laser_filters/LaserScanBoxFilter
      params:
        box_frame: laser_frame

        min_x: -0.30
        max_x: 0.30

        min_y: -0.39
        max_y: 0.39

        min_z: -0.25
        max_z: 0.25